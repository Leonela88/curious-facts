<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Curious Facts </h1>
        <img src="newspaper.avif" alt="Old Newspaper img">
    </header>
    <div class="container">
        <main id="main-content">

            <button id="save-fav-btn">Guardar ❤️</button>

            <section id="fact-container">
                <p id="fact-text">Pulsa el botón para cargar un hecho curioso.</p>
            </section>

            <button id="new-fact-btn">Ver otro hecho</button>

            <div id="status-message"></div>
        </main>

        <aside id="favorites-list">
            <h2>Mis Favoritos</h2>
        </aside>
    </div>

    <script src="script.js"></script>
</body>

</html>
